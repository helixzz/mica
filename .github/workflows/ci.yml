name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            code:
              - 'backend/**'
              - 'frontend/**'
              - 'deploy/**'
              - 'e2e/**'
              - '.github/workflows/ci.yml'

  denylist:
    name: Tenant-name denylist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan for banned tenant identifiers
        run: |
          set -e
          # Patterns are obfuscated (character classes / hex) so that this
          # workflow file does not itself trip the scan.
          PATTERNS='[J][Q][P][A]|[j][q][p][a]|jqdomain|\xe4\xbd\xb3\xe6\x9c\x9f'
          if grep -rnP "$PATTERNS" \
               --exclude-dir=.git --exclude-dir=node_modules \
               --exclude-dir=dist --exclude-dir=__pycache__ \
               --exclude='.denylist' --exclude='ci.yml' . ; then
            echo "::error::Banned tenant identifier found. See .denylist for policy."
            exit 1
          fi
          echo "Denylist scan clean."

  backend-lint:
    name: Backend lint + format
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ruff check
        uses: astral-sh/ruff-action@v3
        with:
          src: backend/app
          args: check --config backend/pyproject.toml
      - name: Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          src: backend/app
          args: format --check --config backend/pyproject.toml

  backend-test:
    name: Backend tests + coverage
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mica
          POSTGRES_PASSWORD: mica
          POSTGRES_DB: mica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mica -d mica_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml
      - name: Install deps
        working-directory: backend
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Run pytest with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://mica:mica@localhost:5432/mica_test
        run: |
          .venv/bin/pytest tests/ --cov=app --cov-report=xml --cov-report=term --cov-fail-under=70
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true

  frontend:
    name: Frontend check + test + build
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type check
        working-directory: frontend
        run: npm run type-check
      - name: Run vitest with coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
        continue-on-error: true

  docker-build:
    name: Docker images (Buildx cache)
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  e2e:
    name: E2E smoke + Playwright
    needs: [changes, denylist, backend-lint, backend-test, frontend, docker-build]
    if: >-
      always() && !cancelled() &&
      (needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.denylist.result == 'success' &&
      (needs.backend-lint.result == 'success' || needs.backend-lint.result == 'skipped') &&
      (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      needs.docker-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Load cached backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: mica-backend:0.0.1
          cache-from: type=gha,scope=backend
      - name: Load cached frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          tags: mica-frontend:0.0.1
          cache-from: type=gha,scope=frontend
      - name: Start services
        working-directory: deploy
        run: |
          cp .env.example .env
          cp nginx/conf.d/mica.conf.default nginx/conf.d/mica.conf
          APP_VERSION=0.0.1 docker compose up -d --no-build --wait
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8900/api/v1/auth/login-options > /dev/null 2>&1; then
              echo "Services ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Services did not become ready within 30s"
          docker compose ps
          docker compose logs --tail=50
          exit 1
      - name: API smoke check
        run: |
          curl -sf http://localhost:8900/ > /dev/null
          curl -sf -X POST http://localhost:8900/api/v1/auth/login \
            -d 'username=admin&password=MicaDev2026!' | python3 -c "import sys,json;d=json.load(sys.stdin);assert 'access_token' in d, f'Login failed: {d}'"
          TOKEN=$(curl -sf -X POST http://localhost:8900/api/v1/auth/login \
            -d 'username=alice&password=MicaDev2026!' | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          for ep in items suppliers purchase-requisitions purchase-orders contracts rfqs; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "http://localhost:8900/api/v1/$ep")
            if [ "$STATUS" != "200" ]; then echo "❌ /api/v1/$ep → $STATUS"; exit 1; fi
            echo "✓ /api/v1/$ep → 200"
          done
          echo "✅ E2E smoke: frontend serves, API login & core endpoints work"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e deps
        working-directory: e2e
        run: npm ci --no-audit --no-fund
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install Playwright browsers
        working-directory: e2e
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install chromium --with-deps
          else
            npx playwright install-deps chromium
          fi
      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
      - name: Teardown
        if: always()
        working-directory: deploy
        run: docker compose down -v
